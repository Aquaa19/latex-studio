<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background document shadow sheet -->
  <rect x="24" y="16" width="56" height="72" rx="6" fill="#1e1b4b" opacity="0.4" />
  <!-- Main document sheet -->
  <rect x="20" y="12" width="56" height="72" rx="6" fill="#18181b" stroke="#27272a" stroke-width="2" />
  
  <!-- Fold corner -->
  <path d="M 60 12 L 76 28 L 60 28 Z" fill="url(#foldGrad)" />
  
  <!-- Mock layout lines -->
  <line x1="28" y1="24" x2="52" y2="24" stroke="#52525b" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="32" x2="68" y2="32" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" />
  
  <!-- Centered Lx stylized monogram -->
  <g transform="translate(0, 4)">
    <!-- Symbol L -->
    <path d="M 36 44 L 36 64 L 48 64" fill="none" stroke="#fafafa" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Symbol X -->
    <path d="M 52 48 L 64 60 M 64 48 L 52 60" fill="none" stroke="url(#pageGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>
  
  <!-- Bottom layout line -->
  <line x1="28" y1="76" x2="60" y2="76" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" />
</svg>
